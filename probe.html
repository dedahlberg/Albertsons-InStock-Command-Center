<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albertsons Online Signal Probe</title><style>body{font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172235;margin:0;padding:32px}.wrap{max-width:1050px;margin:auto}.card{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}input,select,button{padding:11px;border:1px solid #cfd8e3;border-radius:9px;font:inherit}button{background:#00529b;color:white;font-weight:700;cursor:pointer}.status{font-weight:800}.good{color:#16803a}.bad{color:#b42318}.muted{color:#6b7280}.hint{font-size:12px;color:#6b7280;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf1f5;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#6b7280}.preset{background:#eef5fb;border:1px solid #cfe1f0;color:#00529b}.mode{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.mode button{background:#fff;color:#00529b}.mode button.active{background:#00529b;color:#fff}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>Albertsons Companies Online In-Stock Probe</h1><p class="muted">Test a banner + store against either a keyword or an exact Albertsons Companies product ID.</p><div class="mode"><button class="active" id="modeExact">Exact Product ID</button><button id="modeKeyword">Keyword Search</button></div><div class="grid"><select id="banner"><option value="albertsons">Albertsons</option><option value="tomthumb">Tom Thumb</option><option value="randalls">Randall's</option><option value="united">United</option><option value="marketstreet">Market Street</option></select><input id="store" value="0036" placeholder="Store #"><select id="preset"><option value="960516496">Red Baron Deep Dish Pepperoni — 960516496</option><option value="960225277">Bibigo Pork & Vegetable Mini Wontons — 960225277</option></select><input id="q" value="960516496" placeholder="Product ID / keyword"><button id="run">Check Store</button></div><div class="hint" id="hint">Exact mode: product ID results are filtered to an exact ID match.</div><p id="msg" class="status"></p></div><div class="card"><table><thead><tr><th>Product</th><th>Product ID</th><th>UPC</th><th>Price</th><th>Base</th><th>Online Signal</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">Run a check to populate results.</td></tr></tbody></table></div></div><script>const $=s=>document.querySelector(s);let mode='exact';function setMode(m){mode=m;$('#modeExact').classList.toggle('active',m==='exact');$('#modeKeyword').classList.toggle('active',m==='keyword');$('#preset').style.display=m==='exact'?'block':'none';$('#q').value=m==='exact'?$('#preset').value:'Red Baron';$('#q').placeholder=m==='exact'?'Product ID':'Keyword';$('#hint').textContent=m==='exact'?'Exact mode: product ID results are filtered to an exact ID match.':'Keyword mode: useful for discovering products but less reliable for validation.'}$('#modeExact').onclick=()=>setMode('exact');$('#modeKeyword').onclick=()=>setMode('keyword');$('#preset').onchange=()=>{$('#q').value=$('#preset').value};async function run(){const b=$('#banner').value,s=$('#store').value.trim(),q=$('#q').value.trim();$('#msg').className='status';$('#msg').textContent='Checking…';$('#rows').innerHTML='<tr><td colspan="6" class="muted">Loading…</td></tr>';try{const params=new URLSearchParams({banner:b,storeId:s,rows:'25'});if(mode==='exact')params.set('productId',q);else params.set('q',q);const r=await fetch(`/api/availability?${params}`);const d=await r.json();if(!d.ok)throw new Error(d.error+(d.detail?`: ${d.detail}`:''));const view=mode==='exact'?d.matched:d.results;$('#msg').className='status '+(view.length?'good':'bad');$('#msg').textContent=mode==='exact'?`${d.count} search results; ${d.exactCount} exact product match(es) for store ${d.storeId}`:`${d.count} matching products returned for store ${d.storeId}`;$('#rows').innerHTML=view.length?view.map(x=>`<tr><td><strong>${x.name||'—'}</strong></td><td>${x.pid||'—'}</td><td>${x.upc||'—'}</td><td>${x.price??'—'}</td><td>${x.basePrice??'—'}</td><td class="${x.available?'good':'bad'}">${x.available?'AVAILABLE':String(x.inventoryAvailable)==='0'?'UNAVAILABLE':'UNKNOWN'}</td></tr>`).join(''):`<tr><td colspan="6" class="muted">No exact match. If keyword search returns products but exact mode does not, the product ID is not being surfaced for this store. If both return zero, the store web-location mapping is likely wrong.</td></tr>`}catch(e){$('#msg').className='status bad';$('#msg').textContent=e.message;$('#rows').innerHTML='<tr><td colspan="6" class="muted">Probe failed.</td></tr>'}}$('#run').onclick=run;</script></body></html>
