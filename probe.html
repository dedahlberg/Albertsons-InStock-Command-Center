<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albertsons Online Signal Probe</title><style>body{font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172235;margin:0;padding:32px}.wrap{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}input,select,button{padding:11px;border:1px solid #cfd8e3;border-radius:9px;font:inherit}button{background:#00529b;color:white;font-weight:700;cursor:pointer}.status{font-weight:800}.good{color:#16803a}.bad{color:#b42318}.muted{color:#6b7280}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf1f5;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#6b7280}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="card"><h1>Albertsons Companies Online In-Stock Probe</h1><p class="muted">Tests the public browser-facing catalog signal for a specific banner, store number, and product search.</p><div class="grid"><select id="banner"><option value="albertsons">Albertsons</option><option value="tomthumb">Tom Thumb</option><option value="randalls">Randall's</option><option value="united">United</option></select><input id="store" value="4102" placeholder="Store #"><input id="q" value="Red Baron" placeholder="Product / UPC / product ID"><button id="run">Check Store</button></div><p id="msg" class="status"></p></div><div class="card"><table><thead><tr><th>Product</th><th>UPC</th><th>Price</th><th>Base</th><th>Online Signal</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">Run a check to populate results.</td></tr></tbody></table></div></div><script>const $=s=>document.querySelector(s);async function run(){const b=$('#banner').value,s=$('#store').value.trim(),q=$('#q').value.trim();$('#msg').className='status';$('#msg').textContent='Checking…';$('#rows').innerHTML='<tr><td colspan="5" class="muted">Loading…</td></tr>';try{const r=await fetch(`/api/availability?banner=${encodeURIComponent(b)}&storeId=${encodeURIComponent(s)}&q=${encodeURIComponent(q)}&rows=20`);const d=await r.json();if(!d.ok)throw new Error(d.error+(d.detail?`: ${d.detail}`:''));$('#msg').className='status good';$('#msg').textContent=`${d.count} matching products returned for store ${d.storeId}`;$('#rows').innerHTML=d.results.length?d.results.map(x=>`<tr><td><strong>${x.name||'—'}</strong><br><span class="muted">${x.pid||''}</span></td><td>${x.upc||'—'}</td><td>${x.price??'—'}</td><td>${x.basePrice??'—'}</td><td class="${x.available?'good':'bad'}">${x.available?'AVAILABLE':String(x.inventoryAvailable)==='0'?'UNAVAILABLE':'UNKNOWN'}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No matching products.</td></tr>'}catch(e){$('#msg').className='status bad';$('#msg').textContent=e.message;$('#rows').innerHTML='<tr><td colspan="5" class="muted">Probe failed.</td></tr>'}}$('#run').onclick=run;</script></body></html>
